spring.datasource.url=jdbc:mysql://localhost:3306/time_management?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=wjx5201314

# 开发调试端口（避免本地 8080 被占用）
server.port=8081

mybatis-plus.configuration.map-underscore-to-camel-case=true

# 文件上传限制（默认 1MB 太小，avatar 可能超过）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT settings could go here

# ==================== AI 配置 ====================
# AI 缓存时长（分钟）
ai.cache-minutes=5

# AI 日志扫描间隔（毫秒，10分钟）
ai.log-scan-interval=600000

# AI 日志异常检测阈值
ai.log-anomaly-threshold=10

# ==================== 日志级别 ====================
logging.level.root=INFO
logging.level.com.timemanager=DEBUG
logging.level.com.timemanager.ai=DEBUG

# 开发模式，允许部分接口匿名访问以便本地调试（不要在生产启用）
app.dev-mode=true

# 备份目录（相对于应用运行目录）
app.backup-dir=./backups

